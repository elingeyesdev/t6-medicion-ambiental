name: Productor raster
on:
  pull_request:
    branches: [develop, main, 'feature/**']
    paths: ['herramientas/datos/raster/**', 'web/app/Services/Mapas/**', '.github/workflows/raster66.yml']
permissions:
  contents: read
jobs:
  contrato-local:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y libeccodes0
      - run: python -m pip install -r herramientas/datos/raster/requirements.txt
      - name: Probar lectura y publicación sin descargar datos
        run: python -m unittest discover -s herramientas/datos/raster/tests -p 'test_*.py'

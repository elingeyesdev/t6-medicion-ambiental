name: ANA-01 metadatos y propuesta

on:
  pull_request:
    branches: [develop, main, 'feature/**']
    paths: ['herramientas/inundaciones/**', 'compartido/inundaciones/**', 'docs/evidencias/ana01/**', 'docs/ANA01_INUNDACIONES.md', '.github/workflows/ana01.yml']
  push:
    branches: [develop, main]
    paths: ['herramientas/inundaciones/**', 'compartido/inundaciones/**', 'docs/evidencias/ana01/**', '.github/workflows/ana01.yml']

permissions:
  contents: read

jobs:
  verificar-preparacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar lector y evidencia sin red
        run: python -m unittest discover -s herramientas/inundaciones -p 'test_*.py'
      - name: Instalar dependencias geométricas ya fijadas
        run: python -m pip install -r herramientas/sequias/requirements-muestras.txt
      - name: Contrastar el área técnica con el catálogo de Santa Cruz
        run: python herramientas/inundaciones/verificar_area.py

name: Base web y API

on:
  pull_request:
    branches: [develop, main]
    paths: ['web/**', 'compartido/api/**', 'docs/evidencias/api01/**', '.github/workflows/web.yml']
  push:
    branches: [develop, main]
    paths: ['web/**', 'compartido/api/**', 'docs/evidencias/api01/**', '.github/workflows/web.yml']

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3, curl, fileinfo
          coverage: none
          tools: composer:v2
      - name: Instalar dependencias fijadas
        working-directory: web
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validar Composer
        working-directory: web
        run: composer validate --strict
      - name: Comprobar formato
        working-directory: web
        run: composer lint
      - name: Ejecutar pruebas aisladas
        working-directory: web
        run: composer test

  contrato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - name: Verificar evidencia congelada contra el contrato
        run: python compartido/api/validar_respuestas.py

  visor-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar estado, fechas, paginación y respuestas atrasadas sin red
        working-directory: web
        run: npm test
